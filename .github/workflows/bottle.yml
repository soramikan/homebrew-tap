name: Bottle

# 手動実行でlnakoのbottle（ビルド済みバイナリ）を対応OS向けにビルドし、
# このリポジトリのGitHub Releaseへuploadしてformulaのbottle blockを更新する。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "bottle対象のlnako version（Formulaのversionと一致必須）"
        required: true
        type: string

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  HOMEBREW_NO_INSTALL_FROM_API: "1"

jobs:
  build:
    name: Build bottle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-15
          - label: linux-x64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Link this tap into Homebrew
        shell: bash
        run: |
          tap_dir="$(brew --repository)/Library/Taps/soramikan/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
      - name: Install from source for bottling
        shell: bash
        run: brew install --verbose --build-bottle soramikan/tap/lnako
      - name: Test installed formula
        shell: bash
        run: brew test soramikan/tap/lnako
      - name: Produce bottle tarball
        shell: bash
        run: |
          mkdir -p bottles
          cd bottles
          brew bottle --json --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/lnako-${{ inputs.version }}" soramikan/tap/lnako
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bottle-${{ matrix.label }}
          path: bottles/*
          if-no-files-found: error

  publish:
    name: Publish bottles and update formula
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@634f93cb2916e3fdff4798551b0b23f03a8ba03b # v5.0.0
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true
      - name: Merge bottle block into formula
        shell: bash
        run: brew bottle --merge --write --no-commit bottles/*.json
      - name: Upload bottles to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="lnako-${{ inputs.version }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "lnako ${{ inputs.version }} bottles" \
            --notes "Homebrew bottles for lnako ${{ inputs.version }}" \
            --verify-tag=false 2>/dev/null || true
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" bottles/*.bottle.tar.gz --clobber
      - name: Commit updated formula
        shell: bash
        run: |
          if git diff --quiet; then
            echo "formulaに変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lnako.rb
          git commit -m "lnako ${{ inputs.version }}: add bottle block"
          git push
